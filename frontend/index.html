<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mascota</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Mi Mascota</h1>

        <div class="selector-mascota">
            <label for="selector-mascota">Mascotas disponibles</label>
            <select id="selector-mascota" name="mascota" disabled>
                <option value="">Cargando mascotas...</option>
            </select>
        </div>

        <section id="qr-mascota" class="qr-mascota" aria-live="polite" hidden>
            <h2 id="qr-mascota-titulo"></h2>
            <p id="qr-mascota-estado">Generando código QR...</p>
            <a id="qr-mascota-enlace" class="qr-mascota-enlace" hidden></a>
            <img id="qr-mascota-imagen" alt="" hidden>
        </section>
    </main>

    <script src="selector-mascotas.js"></script>
</body>

</html>
